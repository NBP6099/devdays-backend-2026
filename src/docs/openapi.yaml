openapi: 3.0.0
info:
  title: Users API
  version: 1.0.0
  description: API para el taller de Backend 2025

paths:
  /api/v1/users:
    get:
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
    post:
      summary: Crear un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Usuario creado
        '400':
          description: Error de validación